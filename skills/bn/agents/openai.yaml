interface:
  display_name: "bn"
  short_description: "Binary Ninja CLI: decompile, xrefs, callsites, types, previewed mutations, BN Python (live GUI or headless)"
  default_prompt: "Use $bn to drive Binary Ninja through the local bn CLI; prefer built-in commands (incl. bn evidence for vtable/pointer-table, .init_array, protobuf/RTTI, and raw-ABI call evidence on stripped C++/firmware), preview mutations, and use bn py exec only when needed. For unknown-binary triage consult bn-re (esp. hidden code-surface / dispatch-table hunting); for vuln audits consult bn-vr (esp. sink enumeration and source->sink tracing)."
