[project]
name = "bn"
# Canonical version literal for the whole project. src/bn/version.py derives
# VERSION from this (the uv_build backend requires a static literal here and
# cannot read it from a Python attribute), and the bridge's plugin.json carries
# no version of its own, so this is the single place to bump (#82).
version = "0.20.0"
description = "Agent-friendly Binary Ninja CLI with a GUI companion bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "banteg", email = "4562643+banteg@users.noreply.github.com" },
    { name = "m4ul3r", email = "75012320+m4ul3r@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/m4ul3r/bn"
Issues = "https://github.com/m4ul3r/bn/issues"
Upstream = "https://github.com/banteg/bn"

[project.scripts]
bn = "bn.cli:main"
bn-agent = "bn.headless:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
# uv_build < 0.11.29 applied NO excludes -- not `wheel-exclude`, not
# `source-exclude`, not even its own documented `__pycache__`/`*.pyc`/`*.pyo`
# defaults -- to `tool.uv.build-backend.data` trees. Because `skills/` ships as
# install-prefix data, any local bytecode under it landed in the wheel as
# `bn-<version>.data/data/bn-kernel/__pycache__/...`. 0.11.29 is the first
# release that filters the data tree; the range spans both known-good minors so
# a 0.11.x or 0.12.x uv can use its bundled backend instead of downloading one.
requires = ["uv_build>=0.11.29,<0.13"]
build-backend = "uv_build"

# The bridge is a normal src-layout package so wheel builds apply Python package
# excludes to it instead of copying it wholesale as data (#406). It still carries
# plugin.json so `bn plugin install` can symlink/copy the package directory into
# Binary Ninja's plugin directory. The agent skills remain install-prefix data.
[tool.uv.build-backend.data]
data = "skills"

[tool.uv.build-backend]
module-name = ["bn", "bn_agent_bridge"]
# Excludes are UNANCHORED and use the PEP 639 reduced glob syntax, so bare
# `__pycache__` already matches at every depth; the previous `**/`-prefixed
# spelling was not the documented form. `source-exclude` is listed alongside
# `wheel-exclude` because uv applies source excludes to wheels as well, which
# keeps a source-tree build and an sdist->wheel build carrying the same files.
source-exclude = ["__pycache__", "*.pyc", "*.pyo"]
wheel-exclude = ["__pycache__", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_bn: requires a real Binary Ninja install (skipped without one; fails when BN_REQUIRE_REAL_TESTS=1)",
    "no_cache_isolation: opt out of conftest's per-test BN_CACHE_DIR pin (only for tests exercising platform-default path selection)",
]
