[project]
name = "bn"
# Canonical version literal for the whole project. src/bn/version.py derives
# VERSION from this (the uv_build backend requires a static literal here and
# cannot read it from a Python attribute), and the bridge's plugin.json carries
# no version of its own, so this is the single place to bump (#82).
version = "0.20.0"
description = "Agent-friendly Binary Ninja CLI with a GUI companion bridge"
readme = "README.md"
authors = [
    { name = "banteg", email = "4562643+banteg@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
bn = "bn.cli:main"
bn-agent = "bn.headless:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# The bridge is a normal src-layout package so wheel builds apply Python package
# excludes to it instead of copying it wholesale as data (#406). It still carries
# plugin.json so `bn plugin install` can symlink/copy the package directory into
# Binary Ninja's plugin directory. The agent skills remain install-prefix data.
[tool.uv.build-backend.data]
data = "skills"

[tool.uv.build-backend]
module-name = ["bn", "bn_agent_bridge"]
wheel-exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The only quality gate here is a green local `uv run pytest`, and serial it costs
# ~302s (mocked 204s + real-BN 98s) against 12 cores. Parallel takes the full
# suite to ~113s, which matters because every agent and every review round pays
# that cost. Safe because #589 pins a per-test BN_CACHE_DIR and #590 serializes
# tests/fixtures builds behind .build.lock.
#
# `--dist loadgroup` is REQUIRED, not a tuning knob: it honors the
# `xdist_group` mark, which tests/test_taint_integration.py uses to pin itself
# to one worker. That module self-compiles its OWN corpus under
# tests/taint_corpus/ and drives live bn instances; #590's
# tests/fixtures/.build.lock covers neither, so concurrent workers race on it --
# distributed, that lane fails 3/21 while passing 21/21 on one worker. Drop this
# and the real-BN taint lane goes flaky.
# Pass `-n 0` to disable for an interactive `--pdb`/`-x` debugging session.
addopts = ["-n", "auto", "--dist", "loadgroup"]
markers = [
    "real_bn: requires a real Binary Ninja install (skipped without one; fails when BN_REQUIRE_REAL_TESTS=1)",
    "no_cache_isolation: opt out of conftest's per-test BN_CACHE_DIR pin (only for tests exercising platform-default path selection)",
]
