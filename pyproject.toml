[project]
name = "bn"
# Canonical version literal for the whole project. src/bn/version.py derives
# VERSION from this (the uv_build backend requires a static literal here and
# cannot read it from a Python attribute), and the bridge's plugin.json carries
# no version of its own, so this is the single place to bump (#82).
version = "0.20.0"
description = "Agent-friendly Binary Ninja CLI with a GUI companion bridge"
readme = "README.md"
authors = [
    { name = "banteg", email = "4562643+banteg@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
bn = "bn.cli:main"
bn-agent = "bn.headless:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# The bridge plugin and agent skills live at the repo root (outside src/bn) so
# Binary Ninja can load the plugin directly, but a wheel install needs them too,
# or `bn plugin install`, `bn skill install`, and `python -m bn_agent_bridge`
# all break (#83). Ship the bridge into purelib (so it installs into
# site-packages and is importable as bn_agent_bridge -- the symlinked paths.py/
# version.py are resolved to real files at build time) and the skills under the
# install prefix. paths.py resolves these installed locations at runtime.
[tool.uv.build-backend.data]
purelib = "plugin"
data = "skills"

[tool.uv.build-backend]
wheel-exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin"]
